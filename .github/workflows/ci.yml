# CI: every push runs the backend pytest suite (pure unit tests plus the
# test_integration_*.py layer, which needs the `db` service below) and the
# Flutter analyze + widget tests. No AWS credentials are used or required --
# S3/GitHub/Bedrock calls touched by integration tests are exercised only
# where they degrade gracefully without network access.
#
# CD: once both test jobs are green, `release` builds the Android APKs and
# attaches them to a GitHub Release, so every push to main lands an
# installable build (see the job comment for the knobs).
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: builder_plaza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/builder_plaza_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install deps (CPU-only torch keeps the cache small)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: widget tests
        run: flutter test

  # Builds the sideloadable Android artefacts. Runs on every push (so a broken
  # build surfaces on feature branches too) but only publishes a GitHub Release
  # from main. Configuration:
  #   vars.API_BASE_URL           - backend the APK talks to; falls back to the
  #                                 demo ALB below if the repo variable is unset.
  #   secrets.ANDROID_KEYSTORE_*  - optional. Set all four and releases are
  #                                 signed with a stable upload key, so a new
  #                                 build installs over the previous one. Without
  #                                 them the debug key is used and the phone
  #                                 rejects the upgrade -- uninstall first.
  release:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://builder-plaza-alb-270417897.ap-southeast-1.elb.amazonaws.com' }}
      # Lifted to job level so the `if:` below can test them -- the `secrets`
      # context is not available in step conditionals.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore upload keystore (skipped when the secrets are unset)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=$(pwd)/android/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # --build-number keeps versionCode monotonic across runs, so each release
      # is installable over the last one.
      - name: Build APKs
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --build-number=${{ github.run_number }}
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --build-number=${{ github.run_number }}

      - name: Drop the keystore before anything else can read it
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: builder-plaza-apk-${{ github.run_number }}
          path: frontend/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          {
            echo "Automated build of \`${{ github.sha }}\`."
            echo
            echo "Backend: \`$API_BASE_URL\`"
            echo
            echo "Install \`app-arm64-v8a-release.apk\` on any recent phone;"
            echo "use the fat \`app-release.apk\` if unsure which ABI you need."
          } > notes.md
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-*-release.apk \
            --title "Builder Plaza build ${{ github.run_number }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
